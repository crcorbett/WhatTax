name: Docs Preview Deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan or deploy one trusted same-repository PR candidate
        required: true
        type: choice
        options:
          - plan
          - deploy
      candidate_sha:
        description: Exact trusted pull-request head SHA
        required: true
        type: string
      pr_number:
        description: Open same-repository pull-request number
        required: true
        type: string
      accepted_plan_sha256:
        description: Accepted canonical plan digest for deploy
        required: false
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: taxkit-docs-preview-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  preview:
    name: ${{ inputs.operation }} trusted Preview
    if: github.repository == 'crcorbett/taxkit'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: taxkit-docs-preview
    env:
      ALCHEMY_PROFILE: default
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      PR_NUMBER: ${{ inputs.pr_number }}
      OPERATION: ${{ inputs.operation }}
      ACCEPTED_PLAN_SHA256: ${{ inputs.accepted_plan_sha256 }}
    steps:
      - name: Check trusted same-repository PR and exact Quality result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_NUMBER" | grep -Eq '^[1-9][0-9]*$'
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r .base.ref <<<"$pr_json")" = "main"
          pr_state="$(jq -r .state <<<"$pr_json")"
          if [ "$pr_state" = "open" ]; then
            test "$(jq -r .draft <<<"$pr_json")" = "true"
          else
            # The first dispatch can only happen after this workflow lands on
            # the default branch. A merged PR head remains source-bound and
            # exact, while later Preview dispatches use an open draft PR.
            test "$pr_state" = "closed"
            test "$(jq -r .merged <<<"$pr_json")" = "true"
          fi
          test "$(jq -r .head.repo.full_name <<<"$pr_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .head.sha <<<"$pr_json")" = "$CANDIDATE_SHA"
          checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs?per_page=100")"
          jq -e '[.check_runs[] | select((.name | test("quality"; "i"))) | .conclusion] | length > 0 and all(. == "success")' <<<"$checks" >/dev/null

      - name: Check out exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned Playwright browser
        run: apps/docs/node_modules/.bin/playwright install --with-deps chromium

      - name: Validate deployment owners
        run: bun run check:docs-deployment

      - name: Build exact deployment input
        run: bun run --filter=docs build:cloudflare

      - name: Materialize ephemeral Alchemy state-store credential cache
        run: |
          set -euo pipefail
          ALCHEMY_PLAIN=1 CI=1 bunx alchemy login --profile "$ALCHEMY_PROFILE" > /dev/null
          ALCHEMY_PLAIN=1 CI=0 bunx alchemy cloudflare bootstrap --profile "$ALCHEMY_PROFILE" --worker-name alchemy-state-store

      - name: Plan exact Preview candidate
        id: plan
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docs-deployment"
          stage="pr-${PR_NUMBER}"
          ALCHEMY_PLAIN=1 CI=1 bunx alchemy plan --stage "$stage" --profile "$ALCHEMY_PROFILE" > "$RUNNER_TEMP/docs-deployment/alchemy-plan.txt"
          sed -E $'s/\\033\\[[0-9;]*m//g' "$RUNNER_TEMP/docs-deployment/alchemy-plan.txt" > "$RUNNER_TEMP/docs-deployment/alchemy-plan.clean.txt"
          resources="$(grep -E '^\[(DocsBuild|DocsWebsite)\] (create|update|noop|delete)$' "$RUNNER_TEMP/docs-deployment/alchemy-plan.clean.txt" || true)"
          resource_count="$(printf '%s\n' "$resources" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$resource_count" -eq 2
          first_resource="$(printf '%s\n' "$resources" | sed -n '1p')"
          second_resource="$(printf '%s\n' "$resources" | sed -n '2p')"
          case "$first_resource" in "[DocsBuild] "*) ;; *) echo "Unexpected first resource: $first_resource" >&2; exit 1 ;; esac
          case "$second_resource" in "[DocsWebsite] "*) ;; *) echo "Unexpected second resource: $second_resource" >&2; exit 1 ;; esac
          if grep -E '^\[[^]]+\] (create|update|noop|delete)$' "$RUNNER_TEMP/docs-deployment/alchemy-plan.clean.txt" | grep -Ev '^\[(DocsBuild|DocsWebsite)\] (create|update|noop|delete)$' | grep -q .; then
            echo "Unexpected resource in Alchemy plan" >&2
            exit 1
          fi
          build_action="$(printf '%s\n' "$first_resource" | sed -E 's/^\[[^]]+\] //')"
          website_action="$(printf '%s\n' "$second_resource" | sed -E 's/^\[[^]]+\] //')"
          lockfile_sha256="$(shasum -a 256 bun.lock | cut -d ' ' -f1)"
          config_sha256="$(for file in alchemy.run.ts apps/docs/package.json apps/docs/vite.config.ts apps/docs/src/lib/build/cloudflare-stack.ts apps/docs/src/lib/build/docs-deployment-stage.ts apps/docs/public/_headers; do shasum -a 256 "$file"; done | shasum -a 256 | cut -d ' ' -f1)"
          deployment_input_sha256="$(find apps/docs/dist -type f -print | LC_ALL=C sort | while IFS= read -r file; do shasum -a 256 "$file"; done | shasum -a 256 | cut -d ' ' -f1)"
          jq -nS \
            --arg commit "$CANDIDATE_SHA" \
            --arg lockfile "$lockfile_sha256" \
            --arg deployment "$deployment_input_sha256" \
            --arg config "$config_sha256" \
            --arg stage "$stage" \
            --arg build_action "$build_action" \
            --arg website_action "$website_action" \
            '{candidate:{deploymentInputSha256:$deployment,exactCommit:$commit,lockfileSha256:$lockfile},configSha256:$config,logicalResources:[{action:$build_action,logicalId:"DocsBuild",resourceType:"Command.Build"},{action:$website_action,logicalId:"DocsWebsite",resourceType:"Cloudflare.Worker"}],redaction:{ansiRemoved:true,secretValuesIncluded:false,timestampsExcludedFromDigest:true},schemaVersion:1,stack:"TaxKitDocsCloudflare",stage:$stage}' \
            > "$RUNNER_TEMP/docs-deployment/projection.json"
          plan_sha256="$(jq -cS . "$RUNNER_TEMP/docs-deployment/projection.json" | tr -d '\n' | shasum -a 256 | cut -d ' ' -f1)"
          jq -nS \
            --arg acceptedBy "$GITHUB_ACTOR" \
            --arg acceptedPlanSha256 "$plan_sha256" \
            --arg operation "preview-plan" \
            --arg receiptPath "docs/evidence/deployments/workflow-${GITHUB_RUN_ID}/plan.json" \
            --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile projection "$RUNNER_TEMP/docs-deployment/projection.json" \
            '{acceptedBy:$acceptedBy,acceptedPlanSha256:$acceptedPlanSha256,observedAt:$observedAt,operation:$operation,projection:$projection[0],receiptPath:$receiptPath,replanSha256:null,schemaVersion:1}' \
            > "$RUNNER_TEMP/docs-deployment/plan.json"
          echo "plan_sha256=$plan_sha256" >> "$GITHUB_OUTPUT"

      - name: Schema-check initial Preview plan
        env:
          TAXKIT_WORKFLOW_PLAN_RECEIPT: ${{ runner.temp }}/docs-deployment/plan.json
          TAXKIT_WORKFLOW_PLAN_CANDIDATE_COMMIT: ${{ inputs.candidate_sha }}
          TAXKIT_WORKFLOW_PLAN_OPERATION: preview-plan
          TAXKIT_WORKFLOW_PLAN_STAGE: pr-${{ inputs.pr_number }}
          TAXKIT_WORKFLOW_PLAN_SHA256: ${{ steps.plan.outputs.plan_sha256 }}
        run: bun run check:docs-deployment-workflow-plan

      - name: Replan and deploy accepted Preview candidate
        if: inputs.operation == 'deploy'
        run: |
          set -euo pipefail
          test -n "$ACCEPTED_PLAN_SHA256"
          test "$ACCEPTED_PLAN_SHA256" = "${{ steps.plan.outputs.plan_sha256 }}"
          stage="pr-${PR_NUMBER}"
          ALCHEMY_PLAIN=1 CI=1 bunx alchemy plan --stage "$stage" --profile "$ALCHEMY_PROFILE" > "$RUNNER_TEMP/docs-deployment/alchemy-replan.txt"
          sed -E $'s/\\033\\[[0-9;]*m//g' "$RUNNER_TEMP/docs-deployment/alchemy-replan.txt" > "$RUNNER_TEMP/docs-deployment/alchemy-replan.clean.txt"
          all_replan_resources="$(grep -E '^\[[^]]+\] (create|update|noop|delete)$' "$RUNNER_TEMP/docs-deployment/alchemy-replan.clean.txt" || true)"
          unexpected_replan_resources="$(printf '%s\n' "$all_replan_resources" | grep -Ev '^\[(DocsBuild|DocsWebsite)\] (create|update|noop|delete)$' || true)"
          test -z "$unexpected_replan_resources"
          replan_resources="$(printf '%s\n' "$all_replan_resources" | grep -E '^\[(DocsBuild|DocsWebsite)\] (create|update|noop|delete)$' || true)"
          replan_resource_count="$(printf '%s\n' "$replan_resources" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$replan_resource_count" -eq 2
          replan_first_resource="$(printf '%s\n' "$replan_resources" | sed -n '1p')"
          replan_second_resource="$(printf '%s\n' "$replan_resources" | sed -n '2p')"
          case "$replan_first_resource" in "[DocsBuild] "*) ;; *) echo "Unexpected first replan resource: $replan_first_resource" >&2; exit 1 ;; esac
          case "$replan_second_resource" in "[DocsWebsite] "*) ;; *) echo "Unexpected second replan resource: $replan_second_resource" >&2; exit 1 ;; esac
          replan_build_action="$(printf '%s\n' "$replan_first_resource" | sed -E 's/^\[[^]]+\] //')"
          replan_website_action="$(printf '%s\n' "$replan_second_resource" | sed -E 's/^\[[^]]+\] //')"
          replan_lockfile_sha256="$(shasum -a 256 bun.lock | cut -d ' ' -f1)"
          replan_config_sha256="$(for file in alchemy.run.ts apps/docs/package.json apps/docs/vite.config.ts apps/docs/src/lib/build/cloudflare-stack.ts apps/docs/src/lib/build/docs-deployment-stage.ts apps/docs/public/_headers; do shasum -a 256 "$file"; done | shasum -a 256 | cut -d ' ' -f1)"
          replan_deployment_input_sha256="$(find apps/docs/dist -type f -print | LC_ALL=C sort | while IFS= read -r file; do shasum -a 256 "$file"; done | shasum -a 256 | cut -d ' ' -f1)"
          jq -nS \
            --arg commit "$CANDIDATE_SHA" \
            --arg lockfile "$replan_lockfile_sha256" \
            --arg deployment "$replan_deployment_input_sha256" \
            --arg config "$replan_config_sha256" \
            --arg stage "$stage" \
            --arg build_action "$replan_build_action" \
            --arg website_action "$replan_website_action" \
            '{candidate:{deploymentInputSha256:$deployment,exactCommit:$commit,lockfileSha256:$lockfile},configSha256:$config,logicalResources:[{action:$build_action,logicalId:"DocsBuild",resourceType:"Command.Build"},{action:$website_action,logicalId:"DocsWebsite",resourceType:"Cloudflare.Worker"}],redaction:{ansiRemoved:true,secretValuesIncluded:false,timestampsExcludedFromDigest:true},schemaVersion:1,stack:"TaxKitDocsCloudflare",stage:$stage}' \
            > "$RUNNER_TEMP/docs-deployment/replan-projection.json"
          replan_sha256="$(jq -cS . "$RUNNER_TEMP/docs-deployment/replan-projection.json" | tr -d '\n' | shasum -a 256 | cut -d ' ' -f1)"
          echo "accepted_plan_sha256=$ACCEPTED_PLAN_SHA256"
          echo "replan_sha256=$replan_sha256"
          jq -cS . "$RUNNER_TEMP/docs-deployment/replan-projection.json"
          find "$RUNNER_TEMP/docs-deployment" -maxdepth 1 -type f -print | LC_ALL=C sort
          test "$ACCEPTED_PLAN_SHA256" = "${{ steps.plan.outputs.plan_sha256 }}"
          test "$ACCEPTED_PLAN_SHA256" = "$replan_sha256"
          jq --arg replan "$replan_sha256" '.operation="preview-equal-replan" | .replanSha256=$replan' "$RUNNER_TEMP/docs-deployment/plan.json" > "$RUNNER_TEMP/docs-deployment/plan.with-replan.json"
          mv "$RUNNER_TEMP/docs-deployment/plan.with-replan.json" "$RUNNER_TEMP/docs-deployment/plan.json"
          TAXKIT_WORKFLOW_PLAN_RECEIPT="$RUNNER_TEMP/docs-deployment/plan.json" \
          TAXKIT_WORKFLOW_PLAN_CANDIDATE_COMMIT="$CANDIDATE_SHA" \
          TAXKIT_WORKFLOW_PLAN_OPERATION=preview-equal-replan \
          TAXKIT_WORKFLOW_PLAN_STAGE="$stage" \
          TAXKIT_WORKFLOW_PLAN_SHA256="$ACCEPTED_PLAN_SHA256" \
          TAXKIT_WORKFLOW_PLAN_REQUIRE_REPLAN=1 \
            bun run check:docs-deployment-workflow-plan
          ALCHEMY_PROFILE="$ALCHEMY_PROFILE" CI=1 bun run check:docs-deployment-inventory > "$RUNNER_TEMP/docs-deployment/provider-inventory-before.json"
          stage_count_before="$(jq --arg stage "$stage" '[.stages[] | select(.stage == $stage)] | length' "$RUNNER_TEMP/docs-deployment/provider-inventory-before.json")"
          test "$stage_count_before" -eq 0 || test "$stage_count_before" -eq 1
          previous_version_id=""
          if [ "$stage_count_before" -eq 1 ]; then
            jq -e --arg stage "$stage" '([.stages[] | select(.stage == $stage) | .resources | map(.logicalId) | sort] == [["DocsBuild", "DocsWebsite"]]) and ([.providerWorkers[] | select(.stage == $stage and .logicalId == "DocsWebsite")] | length == 1)' "$RUNNER_TEMP/docs-deployment/provider-inventory-before.json" > /dev/null
            previous_worker_name="$(jq -er --arg stage "$stage" '.stages[] | select(.stage == $stage) | .resources[] | select(.logicalId == "DocsWebsite") | .workerName' "$RUNNER_TEMP/docs-deployment/provider-inventory-before.json")"
            previous_deployments="$(bunx wrangler deployments list --name "$previous_worker_name" --json)"
            previous_version_id="$(jq -er '.[-1].versions[0].version_id' <<<"$previous_deployments")"
          fi
          ALCHEMY_PLAIN=1 CI=1 bunx alchemy deploy --stage "$stage" --profile "$ALCHEMY_PROFILE" --yes
          ALCHEMY_PROFILE="$ALCHEMY_PROFILE" CI=1 bun run check:docs-deployment-inventory > "$RUNNER_TEMP/docs-deployment/provider-inventory.json"
          jq -e --arg stage "$stage" '
            .agreement == "state-provider-agree" and
            ([.stages[] | select(.stage == $stage)] | length == 1) and
            ([.stages[] | select(.stage == $stage) | .resources | map(.logicalId) | sort] == [["DocsBuild", "DocsWebsite"]]) and
            ([.providerWorkers[] | select(.stage == $stage and .logicalId == "DocsWebsite")] | length == 1)
          ' "$RUNNER_TEMP/docs-deployment/provider-inventory.json" > /dev/null
          worker_name="$(jq -er --arg stage "$stage" '.stages[] | select(.stage == $stage) | .resources[] | select(.logicalId == "DocsWebsite") | .workerName' "$RUNNER_TEMP/docs-deployment/provider-inventory.json")"
          worker_url="$(jq -er --arg stage "$stage" '.stages[] | select(.stage == $stage) | .resources[] | select(.logicalId == "DocsWebsite") | .workerUrl' "$RUNNER_TEMP/docs-deployment/provider-inventory.json")"
          deployments="$(bunx wrangler deployments list --name "$worker_name" --json)"
          deployment_id="$(jq -er '.[-1].id // .[-1].deployment_id' <<<"$deployments")"
          version_id="$(jq -er '.[-1].versions[0].version_id' <<<"$deployments")"
          state_store_id="$(jq -er '.stateStore.id' "$RUNNER_TEMP/docs-deployment/provider-inventory.json")"
          jq -nS --arg accountId "$CLOUDFLARE_ACCOUNT_ID" --arg stateStoreId "$state_store_id" --arg stage "$stage" --arg workerName "$worker_name" --arg url "$worker_url" --arg deploymentId "$deployment_id" --arg versionId "$version_id" --arg candidate "$CANDIDATE_SHA" --arg plan "$ACCEPTED_PLAN_SHA256" --arg config "$replan_config_sha256" --arg deployment "$replan_deployment_input_sha256" --arg lockfile "$replan_lockfile_sha256" --arg previousVersionId "$previous_version_id" --arg rollbackRecoveryIdentity "preview-$GITHUB_RUN_ID" --argjson previewPrNumber "$PR_NUMBER" '{accountId:$accountId,acceptedPlanSha256:$plan,candidateCommit:$candidate,configSha256:$config,deploymentId:$deploymentId,deploymentInputSha256:$deployment,lockfileSha256:$lockfile,previousVersionId:(if $previousVersionId == "" then null else $previousVersionId end),previewPrNumber:$previewPrNumber,rollbackRecoveryIdentity:$rollbackRecoveryIdentity,schemaVersion:1,stage:$stage,stateStoreId:$stateStoreId,url:$url,versionId:$versionId,workerName:$workerName}' > "$RUNNER_TEMP/docs-deployment/provider-readback.json"
          printf 'TAXKIT_DOCS_HOSTED_URL=%s\n' "$worker_url" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_DEPLOYMENT_ID=%s\n' "$deployment_id" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_VERSION_ID=%s\n' "$version_id" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_WORKER_NAME=%s\n' "$worker_name" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_CANDIDATE_COMMIT=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_ACCOUNT_ID=%s\n' "$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_STATE_STORE_ID=%s\n' "$state_store_id" >> "$GITHUB_ENV"
          if [ -n "$previous_version_id" ]; then printf 'TAXKIT_DOCS_PREVIOUS_VERSION_ID=%s\n' "$previous_version_id" >> "$GITHUB_ENV"; else printf 'TAXKIT_DOCS_PREVIOUS_VERSION_ID=\n' >> "$GITHUB_ENV"; fi
          printf 'TAXKIT_DOCS_PREVIEW_PR_NUMBER=%s\n' "$PR_NUMBER" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_STAGE=%s\n' "$stage" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_PLAN_SHA256=%s\n' "$ACCEPTED_PLAN_SHA256" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_CONFIG_SHA256=%s\n' "$replan_config_sha256" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_DEPLOYMENT_INPUT_SHA256=%s\n' "$replan_deployment_input_sha256" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_LOCKFILE_SHA256=%s\n' "$replan_lockfile_sha256" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_ROLLBACK_RECOVERY_IDENTITY=preview-%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_ENVIRONMENT=preview\n' >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_EVIDENCE_DIRECTORY=docs/evidence/deployments/workflow-%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - name: Run hosted Preview HTTP/browser/screenshot proof
        if: inputs.operation == 'deploy'
        run: |
          set -euo pipefail
          mkdir -p "$TAXKIT_DOCS_EVIDENCE_DIRECTORY"
          bun run --filter=docs test:cloudflare-hosted > "$RUNNER_TEMP/docs-deployment/hosted-proof.raw.json"
          jq '{acceptedPlanSha256,accountId,candidateCommit,configSha256,deploymentInputSha256,deploymentId,diagnostics,environment,lockfileSha256,previewPrNumber,previousVersionId,rollbackRecoveryIdentity,screenshots,stage,stateStoreId,url,versionId,workerName}' "$RUNNER_TEMP/docs-deployment/hosted-proof.raw.json" > "$RUNNER_TEMP/docs-deployment/hosted-proof.json"
          mkdir -p "$RUNNER_TEMP/docs-deployment/docs/evidence/deployments"
          cp -R "$TAXKIT_DOCS_EVIDENCE_DIRECTORY" "$RUNNER_TEMP/docs-deployment/docs/evidence/deployments/"
          TAXKIT_WORKFLOW_PROVIDER_READBACK="$RUNNER_TEMP/docs-deployment/provider-readback.json" \
          TAXKIT_WORKFLOW_HOSTED_PROBE="$RUNNER_TEMP/docs-deployment/hosted-proof.json" \
          TAXKIT_WORKFLOW_CANDIDATE_COMMIT="$CANDIDATE_SHA" \
          TAXKIT_WORKFLOW_STAGE="$TAXKIT_DOCS_STAGE" \
          TAXKIT_WORKFLOW_PLAN_SHA256="$TAXKIT_DOCS_PLAN_SHA256" \
          TAXKIT_WORKFLOW_SCREENSHOT_ROOT="$RUNNER_TEMP/docs-deployment" \
            bun run check:docs-deployment-workflow-proof

      - name: Upload sanitized Preview plan and replan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: taxkit-docs-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/docs-deployment
          retention-days: 30
          if-no-files-found: error

      - name: Upload Preview provider readback
        if: inputs.operation == 'deploy' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: taxkit-docs-preview-provider-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/docs-deployment/provider-inventory.json
            ${{ runner.temp }}/docs-deployment/provider-readback.json
            ${{ runner.temp }}/docs-deployment/docs/evidence/deployments
            ${{ runner.temp }}/docs-deployment/hosted-proof.raw.json
            ${{ runner.temp }}/docs-deployment/hosted-proof.json
          retention-days: 30
          if-no-files-found: error
