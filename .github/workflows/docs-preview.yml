name: Docs Preview Deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan, deploy or perform one exact-stage legacy migration
        required: true
        type: choice
        options:
          - plan
          - deploy
          - migrate-plan
          - migrate
      candidate_sha:
        description: Exact trusted pull-request head SHA
        required: true
        type: string
      pr_number:
        description: Trusted same-repository pull-request number for the candidate
        required: true
        type: string
      target_stage:
        description: Exact existing stage for the bounded legacy migration
        required: false
        default: ""
        type: string
      accepted_plan_sha256:
        description: Accepted canonical plan digest for deploy
        required: false
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: taxkit-docs-preview-pr-${{ inputs.target_stage || github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  preview:
    name: ${{ inputs.operation }} trusted Preview
    if: github.repository == 'crcorbett/taxkit'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: taxkit-docs-preview
    env:
      ALCHEMY_PROFILE: default
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      PR_NUMBER: ${{ inputs.pr_number }}
      TARGET_STAGE: ${{ inputs.target_stage }}
      OPERATION: ${{ inputs.operation }}
      ACCEPTED_PLAN_SHA256: ${{ inputs.accepted_plan_sha256 }}
      TURBO_CACHE: local:rw,remote:rw
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Check trusted same-repository PR and exact Quality result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docs-deployment"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ -n "$TARGET_STAGE" ]; then
            test "$OPERATION" = "migrate-plan" || test "$OPERATION" = "migrate"
            printf '%s' "$TARGET_STAGE" | grep -Eq '^pr-[1-9][0-9]*$'
          else
            test "$OPERATION" != "migrate-plan"
            test "$OPERATION" != "migrate"
          fi
          printf '%s' "$PR_NUMBER" | grep -Eq '^[1-9][0-9]*$'
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r .base.ref <<<"$pr_json")" = "main"
          pr_state="$(jq -r .state <<<"$pr_json")"
          if [ "$pr_state" = "open" ]; then
            test "$(jq -r .draft <<<"$pr_json")" = "true"
          else
            # The first dispatch can only happen after this workflow lands on
            # the default branch. A merged PR head remains source-bound and
            # exact, while later Preview dispatches use an open draft PR.
            test "$pr_state" = "closed"
            test "$(jq -r .merged <<<"$pr_json")" = "true"
          fi
          test "$(jq -r .head.repo.full_name <<<"$pr_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .head.sha <<<"$pr_json")" = "$CANDIDATE_SHA"
          jq -nS \
            --arg candidate "$CANDIDATE_SHA" \
            --arg operation "$OPERATION" \
            --arg pr "$PR_NUMBER" \
            --arg targetStage "$TARGET_STAGE" \
            --arg workflow "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            '{candidateCommit:$candidate,operation:$operation,prNumber:($pr|tonumber),targetStage:(if $targetStage == "" then null else $targetStage end),sourceRef:"refs/heads/main",workflowCommit:$workflow,workflowName:"Docs Preview Deployment",workflowPath:".github/workflows/docs-preview.yml",workflowRunId:$run}' \
            > "$RUNNER_TEMP/docs-deployment/workflow-input.json"
          checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs?per_page=100")"
          # A rerun can leave a cancelled historical Quality check on the same
          # SHA. Require a completed exact-candidate success, reject any
          # pending attempt, and keep every completed failure blocking.
          quality_runs="$(jq '[.check_runs[] | select((.name | test("quality"; "i"))) | {status,conclusion}]' <<<"$checks")"
          jq -e '
            length > 0 and
            all(.[]; .status == "completed") and
            any(.[]; .conclusion == "success") and
            all(.[]; .conclusion == "success" or .conclusion == "cancelled")
          ' <<<"$quality_runs" >/dev/null

      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Resolve Bun package cache path
        id: bun-cache-path
        run: echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"

      - name: Restore Bun package cache
        id: bun-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ steps.bun-cache-path.outputs.path }}
          key: bun-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock') }}

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Save Bun package cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.bun-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ steps.bun-cache-path.outputs.path }}
          key: ${{ steps.bun-cache-restore.outputs.cache-primary-key }}

      - name: Schema-check workflow source and candidate input
        env:
          TAXKIT_WORKFLOW_INPUT_RECEIPT: ${{ runner.temp }}/docs-deployment/workflow-input.json
          TAXKIT_WORKFLOW_INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_sha }}
          TAXKIT_WORKFLOW_INPUT_WORKFLOW_COMMIT: ${{ github.sha }}
          TAXKIT_WORKFLOW_INPUT_RUN_ID: ${{ github.run_id }}
          TAXKIT_WORKFLOW_INPUT_WORKFLOW_PATH: .github/workflows/docs-preview.yml
          TAXKIT_WORKFLOW_INPUT_OPERATION: ${{ inputs.operation }}
          TAXKIT_WORKFLOW_INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          TAXKIT_WORKFLOW_INPUT_TARGET_STAGE: ${{ inputs.target_stage }}
        run: bun run check:docs-deployment-workflow-input

      - name: Resolve Playwright cache identity
        id: playwright-identity
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
          echo "version=$(apps/docs/node_modules/.bin/playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium cache
        id: playwright-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-identity.outputs.version }}-${{ hashFiles('bun.lock') }}

      - name: Install pinned Playwright browser
        run: apps/docs/node_modules/.bin/playwright install chromium

      - name: Save Playwright Chromium cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.playwright-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.playwright-cache-restore.outputs.cache-primary-key }}

      - name: Validate deployment owners
        run: bun run check:docs-deployment

      - name: Build provider-free docs proof
        run: bun run docs:build

      - name: Materialize ephemeral Alchemy state-store credential cache
        run: |
          set -euo pipefail
          ALCHEMY_PLAIN=1 CI=1 bunx alchemy login --profile "$ALCHEMY_PROFILE" > /dev/null
          ALCHEMY_PLAIN=1 CI=0 bunx alchemy cloudflare bootstrap --profile "$ALCHEMY_PROFILE" --worker-name alchemy-state-store

      - name: Plan exact Preview candidate
        id: plan
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docs-deployment"
          stage="${TARGET_STAGE:-pr-${PR_NUMBER}}"
          plan_kind="deploy"
          plan_operation="preview-plan"
          if [ "$OPERATION" = "migrate-plan" ] || [ "$OPERATION" = "migrate" ]; then
            plan_kind="migrate"
            plan_operation="preview-legacy-migration-plan"
          fi
          ALCHEMY_PLAIN=1 CI=1 bunx alchemy plan --stage "$stage" --profile "$ALCHEMY_PROFILE" > "$RUNNER_TEMP/docs-deployment/alchemy-plan.txt"
          lockfile_sha256="$(shasum -a 256 bun.lock | cut -d ' ' -f1)"
          config_sha256="$(for file in alchemy.run.ts apps/docs/package.json apps/docs/vite.config.ts apps/docs/src/lib/build/cloudflare-stack.ts apps/docs/src/lib/build/docs-deployment-stage.ts apps/docs/public/_headers; do shasum -a 256 "$file"; done | shasum -a 256 | cut -d ' ' -f1)"
          deployment_input_sha256="$(git ls-files -z -- alchemy.run.ts apps/docs packages/docs-content packages/docs-fumadocs | LC_ALL=C sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d ' ' -f1)"
          plan_sha256="$(
            TAXKIT_WORKFLOW_PLAN_CANDIDATE_COMMIT="$CANDIDATE_SHA" \
            TAXKIT_WORKFLOW_PLAN_CONFIG_SHA256="$config_sha256" \
            TAXKIT_WORKFLOW_PLAN_DEPLOYMENT_INPUT_SHA256="$deployment_input_sha256" \
            TAXKIT_WORKFLOW_PLAN_KIND="$plan_kind" \
            TAXKIT_WORKFLOW_PLAN_LOCKFILE_SHA256="$lockfile_sha256" \
            TAXKIT_WORKFLOW_PLAN_PROJECTION_PATH="$RUNNER_TEMP/docs-deployment/projection.json" \
            TAXKIT_WORKFLOW_PLAN_STAGE="$stage" \
            TAXKIT_WORKFLOW_PLAN_TEXT_PATH="$RUNNER_TEMP/docs-deployment/alchemy-plan.txt" \
            bun --conditions=source run tools/docs-deployment/workflow-plan-projection.runtime.ts
          )"
          jq -nS \
            --arg acceptedBy "$GITHUB_ACTOR" \
            --arg acceptedPlanSha256 "$plan_sha256" \
            --arg operation "$plan_operation" \
            --arg receiptPath "docs/evidence/deployments/workflow-${GITHUB_RUN_ID}/plan.json" \
            --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile projection "$RUNNER_TEMP/docs-deployment/projection.json" \
            '{acceptedBy:$acceptedBy,acceptedPlanSha256:$acceptedPlanSha256,observedAt:$observedAt,operation:$operation,projection:$projection[0],receiptPath:$receiptPath,replanSha256:null,schemaVersion:2}' \
            > "$RUNNER_TEMP/docs-deployment/plan.json"
          echo "plan_sha256=$plan_sha256" >> "$GITHUB_OUTPUT"
          echo "plan_operation=$plan_operation" >> "$GITHUB_OUTPUT"

      - name: Schema-check initial Preview plan
        env:
          TAXKIT_WORKFLOW_PLAN_RECEIPT: ${{ runner.temp }}/docs-deployment/plan.json
          TAXKIT_WORKFLOW_PLAN_CANDIDATE_COMMIT: ${{ inputs.candidate_sha }}
          TAXKIT_WORKFLOW_PLAN_OPERATION: ${{ steps.plan.outputs.plan_operation }}
          TAXKIT_WORKFLOW_PLAN_STAGE: ${{ inputs.target_stage || format('pr-{0}', inputs.pr_number) }}
          TAXKIT_WORKFLOW_PLAN_SHA256: ${{ steps.plan.outputs.plan_sha256 }}
        run: bun run check:docs-deployment-workflow-plan

      - name: Replan and deploy accepted Preview candidate
        if: inputs.operation == 'deploy' || inputs.operation == 'migrate'
        run: |
          set -euo pipefail
          test -n "$ACCEPTED_PLAN_SHA256"
          test "$ACCEPTED_PLAN_SHA256" = "${{ steps.plan.outputs.plan_sha256 }}"
          stage="${TARGET_STAGE:-pr-${PR_NUMBER}}"
          replan_kind="deploy"
          replan_operation="preview-equal-replan"
          if [ "$OPERATION" = "migrate" ]; then
            replan_kind="migrate"
            replan_operation="preview-legacy-migration-replan"
          fi
          ALCHEMY_PLAIN=1 CI=1 bunx alchemy plan --stage "$stage" --profile "$ALCHEMY_PROFILE" > "$RUNNER_TEMP/docs-deployment/alchemy-replan.txt"
          replan_lockfile_sha256="$(shasum -a 256 bun.lock | cut -d ' ' -f1)"
          replan_config_sha256="$(for file in alchemy.run.ts apps/docs/package.json apps/docs/vite.config.ts apps/docs/src/lib/build/cloudflare-stack.ts apps/docs/src/lib/build/docs-deployment-stage.ts apps/docs/public/_headers; do shasum -a 256 "$file"; done | shasum -a 256 | cut -d ' ' -f1)"
          replan_deployment_input_sha256="$(git ls-files -z -- alchemy.run.ts apps/docs packages/docs-content packages/docs-fumadocs | LC_ALL=C sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d ' ' -f1)"
          replan_sha256="$(
            TAXKIT_WORKFLOW_PLAN_CANDIDATE_COMMIT="$CANDIDATE_SHA" \
            TAXKIT_WORKFLOW_PLAN_CONFIG_SHA256="$replan_config_sha256" \
            TAXKIT_WORKFLOW_PLAN_DEPLOYMENT_INPUT_SHA256="$replan_deployment_input_sha256" \
            TAXKIT_WORKFLOW_PLAN_KIND="$replan_kind" \
            TAXKIT_WORKFLOW_PLAN_LOCKFILE_SHA256="$replan_lockfile_sha256" \
            TAXKIT_WORKFLOW_PLAN_PROJECTION_PATH="$RUNNER_TEMP/docs-deployment/replan-projection.json" \
            TAXKIT_WORKFLOW_PLAN_STAGE="$stage" \
            TAXKIT_WORKFLOW_PLAN_TEXT_PATH="$RUNNER_TEMP/docs-deployment/alchemy-replan.txt" \
            bun --conditions=source run tools/docs-deployment/workflow-plan-projection.runtime.ts
          )"
          echo "accepted_plan_sha256=$ACCEPTED_PLAN_SHA256"
          echo "replan_sha256=$replan_sha256"
          jq -cS . "$RUNNER_TEMP/docs-deployment/replan-projection.json"
          find "$RUNNER_TEMP/docs-deployment" -maxdepth 1 -type f -print | LC_ALL=C sort
          test "$ACCEPTED_PLAN_SHA256" = "${{ steps.plan.outputs.plan_sha256 }}"
          test "$ACCEPTED_PLAN_SHA256" = "$replan_sha256"
          jq --arg operation "$replan_operation" --arg replan "$replan_sha256" '.operation=$operation | .replanSha256=$replan' "$RUNNER_TEMP/docs-deployment/plan.json" > "$RUNNER_TEMP/docs-deployment/plan.with-replan.json"
          mv "$RUNNER_TEMP/docs-deployment/plan.with-replan.json" "$RUNNER_TEMP/docs-deployment/plan.json"
          TAXKIT_WORKFLOW_PLAN_RECEIPT="$RUNNER_TEMP/docs-deployment/plan.json" \
          TAXKIT_WORKFLOW_PLAN_CANDIDATE_COMMIT="$CANDIDATE_SHA" \
          TAXKIT_WORKFLOW_PLAN_OPERATION="$replan_operation" \
          TAXKIT_WORKFLOW_PLAN_STAGE="$stage" \
          TAXKIT_WORKFLOW_PLAN_SHA256="$ACCEPTED_PLAN_SHA256" \
          TAXKIT_WORKFLOW_PLAN_REQUIRE_REPLAN=1 \
            bun run check:docs-deployment-workflow-plan
          if [ "$OPERATION" = "migrate" ]; then
            TAXKIT_DOCS_DEPLOYMENT_ALLOW_LEGACY=1 \
            TAXKIT_DOCS_DEPLOYMENT_INVENTORY_REPORT="$RUNNER_TEMP/docs-deployment/provider-inventory-before.json" \
            ALCHEMY_PROFILE="$ALCHEMY_PROFILE" CI=1 bun run check:docs-deployment-inventory
          else
            TAXKIT_DOCS_DEPLOYMENT_INVENTORY_REPORT="$RUNNER_TEMP/docs-deployment/provider-inventory-before.json" \
            ALCHEMY_PROFILE="$ALCHEMY_PROFILE" CI=1 bun run check:docs-deployment-inventory
          fi
          stage_count_before="$(jq --arg stage "$stage" '[.stages[] | select(.stage == $stage)] | length' "$RUNNER_TEMP/docs-deployment/provider-inventory-before.json")"
          test "$stage_count_before" -eq 0 || test "$stage_count_before" -eq 1
          legacy_stage_count="$(jq '[.stages[] | select(any(.resources[]; .logicalId == "DocsBuild"))] | length' "$RUNNER_TEMP/docs-deployment/provider-inventory-before.json")"
          if [ "$OPERATION" = "migrate" ]; then
            test "$stage_count_before" -eq 1
            test "$legacy_stage_count" -ge 1
            jq -e --arg stage "$stage" '
              ([.stages[] | select(.stage == $stage) | .resources | map(.logicalId) | sort] == [["DocsBuild", "DocsWebsite"]]) and
              ([.stages[] | select(.stage == $stage) | .resources[] | select(.logicalId == "DocsBuild") | .resourceType] == ["Command.Build"]) and
              ([.stages[] | select(.stage == $stage) | .resources[] | select(.logicalId == "DocsWebsite") | .resourceType] == ["Cloudflare.Worker"]) and
              ([.providerWorkers[] | select(.stage == $stage and .logicalId == "DocsWebsite")] | length == 1) and
              ([.stages[] | select(.stage == $stage) | .resources[] | select(.logicalId == "DocsWebsite") | .workerName] == [.providerWorkers[] | select(.stage == $stage and .logicalId == "DocsWebsite") | .workerName])
            ' "$RUNNER_TEMP/docs-deployment/provider-inventory-before.json" > /dev/null
          else
            test "$legacy_stage_count" -eq 0
          fi
          previous_version_id=""
          if [ "$OPERATION" = "deploy" ] && [ "$stage_count_before" -eq 1 ]; then
            jq -e --arg stage "$stage" '([.stages[] | select(.stage == $stage) | .resources | map(.logicalId) | sort] | . == [["DocsWebsite"]]) and ([.providerWorkers[] | select(.stage == $stage and .logicalId == "DocsWebsite")] | length == 1)' "$RUNNER_TEMP/docs-deployment/provider-inventory-before.json" > /dev/null
            previous_worker_name="$(jq -er --arg stage "$stage" '.stages[] | select(.stage == $stage) | .resources[] | select(.logicalId == "DocsWebsite") | .workerName' "$RUNNER_TEMP/docs-deployment/provider-inventory-before.json")"
            previous_deployments="$(bunx wrangler deployments list --name "$previous_worker_name" --json)"
            previous_version_id="$(jq -er '.[-1].versions[0].version_id' <<<"$previous_deployments")"
          fi
          ALCHEMY_PLAIN=1 CI=1 bunx alchemy deploy --stage "$stage" --profile "$ALCHEMY_PROFILE" --yes
          TAXKIT_DOCS_DEPLOYMENT_INVENTORY_REPORT="$RUNNER_TEMP/docs-deployment/provider-inventory.json" \
          ALCHEMY_PROFILE="$ALCHEMY_PROFILE" CI=1 bun run check:docs-deployment-inventory
          post_legacy_stage_count="$(jq '[.stages[] | select(any(.resources[]; .logicalId == "DocsBuild"))] | length' "$RUNNER_TEMP/docs-deployment/provider-inventory.json")"
          test "$post_legacy_stage_count" -eq "$((legacy_stage_count - 1))"
          jq -e --arg stage "$stage" '
            .agreement == "state-provider-agree" and
            ([.stages[] | select(.stage == $stage)] | length == 1) and
            ([.stages[] | select(.stage == $stage) | .resources | map(.logicalId)] == [["DocsWebsite"]]) and
            ([.providerWorkers[] | select(.stage == $stage and .logicalId == "DocsWebsite")] | length == 1)
          ' "$RUNNER_TEMP/docs-deployment/provider-inventory.json" > /dev/null
          worker_name="$(jq -er --arg stage "$stage" '.stages[] | select(.stage == $stage) | .resources[] | select(.logicalId == "DocsWebsite") | .workerName' "$RUNNER_TEMP/docs-deployment/provider-inventory.json")"
          worker_url="$(jq -er --arg stage "$stage" '.stages[] | select(.stage == $stage) | .resources[] | select(.logicalId == "DocsWebsite") | .workerUrl' "$RUNNER_TEMP/docs-deployment/provider-inventory.json" | sed -E 's:/*$::')"
          state_store_id="$(jq -er '.stateStore.id' "$RUNNER_TEMP/docs-deployment/provider-inventory.json")"
          if [ "$OPERATION" = "migrate" ]; then
            before_resources="$(jq -c --arg stage "$stage" '[.stages[] | select(.stage == $stage) | .resources[] | {logicalId,resourceType,status,workerName,workerUrl}]' "$RUNNER_TEMP/docs-deployment/provider-inventory-before.json")"
            after_resources="$(jq -c --arg stage "$stage" '[.stages[] | select(.stage == $stage) | .resources[] | {logicalId,resourceType,status,workerName,workerUrl}]' "$RUNNER_TEMP/docs-deployment/provider-inventory.json")"
            before_website_worker="$(jq -er --arg stage "$stage" '.stages[] | select(.stage == $stage) | .resources[] | select(.logicalId == "DocsWebsite") | .workerName' "$RUNNER_TEMP/docs-deployment/provider-inventory-before.json")"
            after_website_worker="$(jq -er --arg stage "$stage" '.stages[] | select(.stage == $stage) | .resources[] | select(.logicalId == "DocsWebsite") | .workerName' "$RUNNER_TEMP/docs-deployment/provider-inventory.json")"
            jq -nS \
              --arg acceptedPlanSha256 "$ACCEPTED_PLAN_SHA256" \
              --arg candidateCommit "$CANDIDATE_SHA" \
              --arg stage "$stage" \
              --arg stateStoreId "$state_store_id" \
              --arg beforeWebsiteWorker "$before_website_worker" \
              --arg afterWebsiteWorker "$after_website_worker" \
              --argjson legacyStageCountBefore "$legacy_stage_count" \
              --argjson legacyStageCountAfter "$post_legacy_stage_count" \
              --argjson beforeResources "$before_resources" \
              --argjson afterResources "$after_resources" \
              '{acceptedPlanSha256:$acceptedPlanSha256,after:{resources:$afterResources,websiteWorker:$afterWebsiteWorker},before:{resources:$beforeResources,websiteWorker:$beforeWebsiteWorker},candidateCommit:$candidateCommit,deletedLogicalId:"DocsBuild",legacyStageCountAfter:$legacyStageCountAfter,legacyStageCountBefore:$legacyStageCountBefore,nonClaims:["This receipt proves only the exact target stage state/provider observation and one exact-stage native reconciliation.","It does not establish Production, custom-domain, DNS, publication or unrelated stages."],operation:"preview-legacy-migration",postcondition:"DocsBuild-absent-DocsWebsite-retained",rollback:"native-source-redeploy-only",schemaVersion:1,stage:$stage,stateProviderAgreement:"state-provider-agree",stateStoreId:$stateStoreId}' \
              > "$RUNNER_TEMP/docs-deployment/legacy-migration-readback.json"
          else
            deployments="$(bunx wrangler deployments list --name "$worker_name" --json)"
            deployment_id="$(jq -er '.[-1].id // .[-1].deployment_id' <<<"$deployments")"
            version_id="$(jq -er '.[-1].versions[0].version_id' <<<"$deployments")"
            jq -nS --arg accountId "$CLOUDFLARE_ACCOUNT_ID" --arg stateStoreId "$state_store_id" --arg stage "$stage" --arg workerName "$worker_name" --arg url "$worker_url" --arg deploymentId "$deployment_id" --arg versionId "$version_id" --arg candidate "$CANDIDATE_SHA" --arg plan "$ACCEPTED_PLAN_SHA256" --arg config "$replan_config_sha256" --arg deployment "$replan_deployment_input_sha256" --arg lockfile "$replan_lockfile_sha256" --arg previousVersionId "$previous_version_id" --arg rollbackRecoveryIdentity "preview-$GITHUB_RUN_ID" --argjson previewPrNumber "$PR_NUMBER" '{accountId:$accountId,acceptedPlanSha256:$plan,candidateCommit:$candidate,configSha256:$config,deploymentId:$deploymentId,deploymentInputSha256:$deployment,lockfileSha256:$lockfile,previousVersionId:(if $previousVersionId == "" then null else $previousVersionId end),previewPrNumber:$previewPrNumber,rollbackRecoveryIdentity:$rollbackRecoveryIdentity,schemaVersion:1,stage:$stage,stateStoreId:$stateStoreId,url:$url,versionId:$versionId,workerName:$workerName}' > "$RUNNER_TEMP/docs-deployment/provider-readback.json"
            printf 'TAXKIT_DOCS_HOSTED_URL=%s\n' "$worker_url" >> "$GITHUB_ENV"
            printf 'TAXKIT_DOCS_DEPLOYMENT_ID=%s\n' "$deployment_id" >> "$GITHUB_ENV"
            printf 'TAXKIT_DOCS_VERSION_ID=%s\n' "$version_id" >> "$GITHUB_ENV"
            printf 'TAXKIT_DOCS_WORKER_NAME=%s\n' "$worker_name" >> "$GITHUB_ENV"
            printf 'TAXKIT_DOCS_CANDIDATE_COMMIT=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_ENV"
            printf 'TAXKIT_DOCS_ACCOUNT_ID=%s\n' "$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
            printf 'TAXKIT_DOCS_STATE_STORE_ID=%s\n' "$state_store_id" >> "$GITHUB_ENV"
            if [ -n "$previous_version_id" ]; then printf 'TAXKIT_DOCS_PREVIOUS_VERSION_ID=%s\n' "$previous_version_id" >> "$GITHUB_ENV"; else printf 'TAXKIT_DOCS_PREVIOUS_VERSION_ID=\n' >> "$GITHUB_ENV"; fi
            printf 'TAXKIT_DOCS_PREVIEW_PR_NUMBER=%s\n' "$PR_NUMBER" >> "$GITHUB_ENV"
            printf 'TAXKIT_DOCS_STAGE=%s\n' "$stage" >> "$GITHUB_ENV"
            printf 'TAXKIT_DOCS_PLAN_SHA256=%s\n' "$ACCEPTED_PLAN_SHA256" >> "$GITHUB_ENV"
            printf 'TAXKIT_DOCS_CONFIG_SHA256=%s\n' "$replan_config_sha256" >> "$GITHUB_ENV"
            printf 'TAXKIT_DOCS_DEPLOYMENT_INPUT_SHA256=%s\n' "$replan_deployment_input_sha256" >> "$GITHUB_ENV"
            printf 'TAXKIT_DOCS_LOCKFILE_SHA256=%s\n' "$replan_lockfile_sha256" >> "$GITHUB_ENV"
            printf 'TAXKIT_DOCS_ROLLBACK_RECOVERY_IDENTITY=preview-%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
            printf 'TAXKIT_DOCS_ENVIRONMENT=preview\n' >> "$GITHUB_ENV"
            printf 'TAXKIT_DOCS_EVIDENCE_DIRECTORY=docs/evidence/deployments/workflow-%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          fi

      - name: Run hosted Preview HTTP/browser/screenshot proof
        if: inputs.operation == 'deploy'
        run: |
          set -euo pipefail
          mkdir -p "$TAXKIT_DOCS_EVIDENCE_DIRECTORY"
          bun apps/docs/scripts/test-cloudflare-hosted.tsx > "$RUNNER_TEMP/docs-deployment/hosted-proof.raw.json"
          jq '{acceptedPlanSha256,accountId,candidateCommit,configSha256,deploymentInputSha256,deploymentId,diagnostics,environment,lockfileSha256,previewPrNumber,previousVersionId:(if .previousVersionId == "" then null else .previousVersionId end),rollbackRecoveryIdentity,screenshots,stage,stateStoreId,url,versionId,workerName}' "$RUNNER_TEMP/docs-deployment/hosted-proof.raw.json" > "$RUNNER_TEMP/docs-deployment/hosted-proof.json"
          mkdir -p "$RUNNER_TEMP/docs-deployment/docs/evidence/deployments"
          cp -R "$TAXKIT_DOCS_EVIDENCE_DIRECTORY" "$RUNNER_TEMP/docs-deployment/docs/evidence/deployments/"
          TAXKIT_WORKFLOW_PROVIDER_READBACK="$RUNNER_TEMP/docs-deployment/provider-readback.json" \
          TAXKIT_WORKFLOW_HOSTED_PROBE="$RUNNER_TEMP/docs-deployment/hosted-proof.json" \
          TAXKIT_WORKFLOW_CANDIDATE_COMMIT="$CANDIDATE_SHA" \
          TAXKIT_WORKFLOW_STAGE="$TAXKIT_DOCS_STAGE" \
          TAXKIT_WORKFLOW_PLAN_SHA256="$TAXKIT_DOCS_PLAN_SHA256" \
          TAXKIT_WORKFLOW_SCREENSHOT_ROOT="$RUNNER_TEMP/docs-deployment" \
            bun run check:docs-deployment-workflow-proof

      - name: Upload sanitized Preview plan and replan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: taxkit-docs-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/docs-deployment
          retention-days: 30
          if-no-files-found: error

      - name: Upload Preview provider readback
        if: inputs.operation == 'deploy' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: taxkit-docs-preview-provider-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/docs-deployment/provider-inventory.json
            ${{ runner.temp }}/docs-deployment/provider-readback.json
            ${{ runner.temp }}/docs-deployment/workflow-input.json
            ${{ runner.temp }}/docs-deployment/docs/evidence/deployments
            ${{ runner.temp }}/docs-deployment/hosted-proof.raw.json
            ${{ runner.temp }}/docs-deployment/hosted-proof.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload legacy migration readback
        if: inputs.operation == 'migrate' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: taxkit-docs-preview-legacy-migration-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/docs-deployment/legacy-migration-readback.json
            ${{ runner.temp }}/docs-deployment/provider-inventory-before.json
            ${{ runner.temp }}/docs-deployment/provider-inventory.json
            ${{ runner.temp }}/docs-deployment/workflow-input.json
          retention-days: 30
          if-no-files-found: error
