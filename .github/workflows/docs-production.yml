name: Docs Production Deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan, deploy or source-bound rollback fixed Production
        required: true
        type: choice
        options:
          - plan
          - deploy
          - rollback
      candidate_sha:
        description: Exact accepted candidate SHA
        required: true
        type: string
      accepted_preview_commit:
        description: Candidate SHA accepted by Preview
        required: true
        type: string
      accepted_preview_plan_sha256:
        description: Preview receipt digest accepted for this candidate
        required: true
        type: string
      accepted_preview_run_id:
        description: Successful Preview workflow run whose receipt is accepted
        required: true
        type: string
      accepted_plan_sha256:
        description: Accepted canonical Production plan digest for deploy
        required: false
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: taxkit-docs-production-prod
  cancel-in-progress: false

jobs:
  production:
    name: ${{ inputs.operation }} fixed Production
    if: github.repository == 'crcorbett/taxkit'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: taxkit-docs-production
    env:
      ALCHEMY_PROFILE: default
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      ACCEPTED_PREVIEW_COMMIT: ${{ inputs.accepted_preview_commit }}
      ACCEPTED_PREVIEW_PLAN_SHA256: ${{ inputs.accepted_preview_plan_sha256 }}
      ACCEPTED_PREVIEW_RUN_ID: ${{ inputs.accepted_preview_run_id }}
      ACCEPTED_PLAN_SHA256: ${{ inputs.accepted_plan_sha256 }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - name: Check exact candidate and Quality result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$CANDIDATE_SHA" = "$ACCEPTED_PREVIEW_COMMIT"
          test -n "$ACCEPTED_PREVIEW_PLAN_SHA256"
          preview_run="$(gh run view "$ACCEPTED_PREVIEW_RUN_ID" --json workflowName,headBranch,headSha,status,conclusion,event)"
          test "$(jq -r .workflowName <<<"$preview_run")" = "Docs Preview Deployment"
          test "$(jq -r .headBranch <<<"$preview_run")" = "main"
          test "$(jq -r .headSha <<<"$preview_run")" = "$CANDIDATE_SHA"
          test "$(jq -r .status <<<"$preview_run")" = "completed"
          test "$(jq -r .conclusion <<<"$preview_run")" = "success"
          mkdir -p "$RUNNER_TEMP/accepted-preview"
          gh run download "$ACCEPTED_PREVIEW_RUN_ID" --name "taxkit-docs-preview-provider-$ACCEPTED_PREVIEW_RUN_ID" --dir "$RUNNER_TEMP/accepted-preview"
          accepted_preview_readback="$(find "$RUNNER_TEMP/accepted-preview" -name provider-readback.json -print -quit)"
          accepted_preview_hosted="$(find "$RUNNER_TEMP/accepted-preview" -name hosted-proof.json -print -quit)"
          test -n "$accepted_preview_readback"
          test -n "$accepted_preview_hosted"
          TAXKIT_WORKFLOW_PROVIDER_READBACK="$accepted_preview_readback" \
          TAXKIT_WORKFLOW_HOSTED_PROBE="$accepted_preview_hosted" \
          TAXKIT_WORKFLOW_CANDIDATE_COMMIT="$CANDIDATE_SHA" \
          TAXKIT_WORKFLOW_STAGE="$(jq -er '.stage' "$accepted_preview_readback")" \
          TAXKIT_WORKFLOW_PLAN_SHA256="$ACCEPTED_PREVIEW_PLAN_SHA256" \
            bun run check:docs-deployment-workflow-proof
          jq -e --arg candidate "$CANDIDATE_SHA" --arg plan "$ACCEPTED_PREVIEW_PLAN_SHA256" '(.candidateCommit == $candidate) and (.acceptedPlanSha256 == $plan) and (.stage | startswith("pr-"))' "$accepted_preview_readback" > /dev/null
          jq -e --arg candidate "$CANDIDATE_SHA" --arg plan "$ACCEPTED_PREVIEW_PLAN_SHA256" '(.candidateCommit == $candidate) and (.acceptedPlanSha256 == $plan) and (.diagnostics | length == 0)' "$accepted_preview_hosted" > /dev/null
          printf 'ACCEPTED_PREVIEW_READBACK=%s\n' "$accepted_preview_readback" >> "$GITHUB_ENV"
          printf 'ACCEPTED_PREVIEW_HOSTED=%s\n' "$accepted_preview_hosted" >> "$GITHUB_ENV"
          checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs?per_page=100")"
          jq -e '[.check_runs[] | select((.name | test("quality"; "i"))) | .conclusion] | length > 0 and all(. == "success")' <<<"$checks" >/dev/null

      - name: Check out exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned Playwright browser
        run: apps/docs/node_modules/.bin/playwright install --with-deps chromium

      - name: Validate deployment owners
        run: bun run check:docs-deployment

      - name: Build exact deployment input
        run: bun run --filter=docs build:cloudflare

      - name: Materialize ephemeral Alchemy state-store credential cache
        run: |
          set -euo pipefail
          ALCHEMY_PLAIN=1 CI=1 bunx alchemy login --profile "$ALCHEMY_PROFILE" > /dev/null
          ALCHEMY_PLAIN=1 CI=0 bunx alchemy cloudflare bootstrap --profile "$ALCHEMY_PROFILE" --worker-name alchemy-state-store

      - name: Plan exact fixed Production candidate
        id: plan
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docs-deployment"
          ALCHEMY_PLAIN=1 CI=1 bunx alchemy plan --stage prod --profile "$ALCHEMY_PROFILE" > "$RUNNER_TEMP/docs-deployment/alchemy-plan.txt"
          sed -E $'s/\\033\\[[0-9;]*m//g' "$RUNNER_TEMP/docs-deployment/alchemy-plan.txt" > "$RUNNER_TEMP/docs-deployment/alchemy-plan.clean.txt"
          resources="$(grep -E '^\[(DocsBuild|DocsWebsite)\] (create|update|noop|delete)$' "$RUNNER_TEMP/docs-deployment/alchemy-plan.clean.txt" || true)"
          resource_count="$(printf '%s\n' "$resources" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$resource_count" -eq 2
          first_resource="$(printf '%s\n' "$resources" | sed -n '1p')"
          second_resource="$(printf '%s\n' "$resources" | sed -n '2p')"
          case "$first_resource" in "[DocsBuild] "*) ;; *) echo "Unexpected first resource: $first_resource" >&2; exit 1 ;; esac
          case "$second_resource" in "[DocsWebsite] "*) ;; *) echo "Unexpected second resource: $second_resource" >&2; exit 1 ;; esac
          if grep -E '^\[[^]]+\] (create|update|noop|delete)$' "$RUNNER_TEMP/docs-deployment/alchemy-plan.clean.txt" | grep -Ev '^\[(DocsBuild|DocsWebsite)\] (create|update|noop|delete)$' | grep -q .; then
            echo "Unexpected resource in Alchemy plan" >&2
            exit 1
          fi
          build_action="$(printf '%s\n' "$first_resource" | sed -E 's/^\[[^]]+\] //')"
          website_action="$(printf '%s\n' "$second_resource" | sed -E 's/^\[[^]]+\] //')"
          lockfile_sha256="$(shasum -a 256 bun.lock | cut -d ' ' -f1)"
          config_sha256="$(for file in alchemy.run.ts apps/docs/package.json apps/docs/vite.config.ts apps/docs/src/lib/build/cloudflare-stack.ts apps/docs/src/lib/build/docs-deployment-stage.ts apps/docs/public/_headers; do shasum -a 256 "$file"; done | shasum -a 256 | cut -d ' ' -f1)"
          deployment_input_sha256="$(find apps/docs/dist -type f -print | LC_ALL=C sort | while IFS= read -r file; do shasum -a 256 "$file"; done | shasum -a 256 | cut -d ' ' -f1)"
          jq -nS \
            --arg commit "$CANDIDATE_SHA" \
            --arg lockfile "$lockfile_sha256" \
            --arg deployment "$deployment_input_sha256" \
            --arg config "$config_sha256" \
            --arg build_action "$build_action" \
            --arg website_action "$website_action" \
            '{candidate:{deploymentInputSha256:$deployment,exactCommit:$commit,lockfileSha256:$lockfile},configSha256:$config,logicalResources:[{action:$build_action,logicalId:"DocsBuild",resourceType:"Command.Build"},{action:$website_action,logicalId:"DocsWebsite",resourceType:"Cloudflare.Worker"}],redaction:{ansiRemoved:true,secretValuesIncluded:false,timestampsExcludedFromDigest:true},schemaVersion:1,stack:"TaxKitDocsCloudflare",stage:"prod"}' \
            > "$RUNNER_TEMP/docs-deployment/projection.json"
          plan_sha256="$(jq -cS . "$RUNNER_TEMP/docs-deployment/projection.json" | tr -d '\n' | shasum -a 256 | cut -d ' ' -f1)"
          jq -nS \
            --arg acceptedBy "$GITHUB_ACTOR" \
            --arg acceptedPlanSha256 "$plan_sha256" \
            --arg operation "production-plan" \
            --arg receiptPath "docs/evidence/deployments/workflow-${GITHUB_RUN_ID}/plan.json" \
            --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile projection "$RUNNER_TEMP/docs-deployment/projection.json" \
            '{acceptedBy:$acceptedBy,acceptedPlanSha256:$acceptedPlanSha256,observedAt:$observedAt,operation:$operation,projection:$projection[0],receiptPath:$receiptPath,replanSha256:null,schemaVersion:1}' \
            > "$RUNNER_TEMP/docs-deployment/plan.json"
          echo "plan_sha256=$plan_sha256" >> "$GITHUB_OUTPUT"

      - name: Replan and deploy fixed Production candidate
        if: inputs.operation == 'deploy' || inputs.operation == 'rollback'
        run: |
          set -euo pipefail
          test -n "$ACCEPTED_PLAN_SHA256"
          test "$ACCEPTED_PLAN_SHA256" = "${{ steps.plan.outputs.plan_sha256 }}"
          ALCHEMY_PLAIN=1 CI=1 bunx alchemy plan --stage prod --profile "$ALCHEMY_PROFILE" > "$RUNNER_TEMP/docs-deployment/alchemy-replan.txt"
          sed -E $'s/\\033\\[[0-9;]*m//g' "$RUNNER_TEMP/docs-deployment/alchemy-replan.txt" > "$RUNNER_TEMP/docs-deployment/alchemy-replan.clean.txt"
          all_replan_resources="$(grep -E '^\[[^]]+\] (create|update|noop|delete)$' "$RUNNER_TEMP/docs-deployment/alchemy-replan.clean.txt" || true)"
          unexpected_replan_resources="$(printf '%s\n' "$all_replan_resources" | grep -Ev '^\[(DocsBuild|DocsWebsite)\] (create|update|noop|delete)$' || true)"
          test -z "$unexpected_replan_resources"
          replan_resources="$(printf '%s\n' "$all_replan_resources" | grep -E '^\[(DocsBuild|DocsWebsite)\] (create|update|noop|delete)$' || true)"
          replan_resource_count="$(printf '%s\n' "$replan_resources" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$replan_resource_count" -eq 2
          replan_first_resource="$(printf '%s\n' "$replan_resources" | sed -n '1p')"
          replan_second_resource="$(printf '%s\n' "$replan_resources" | sed -n '2p')"
          case "$replan_first_resource" in "[DocsBuild] "*) ;; *) echo "Unexpected first replan resource: $replan_first_resource" >&2; exit 1 ;; esac
          case "$replan_second_resource" in "[DocsWebsite] "*) ;; *) echo "Unexpected second replan resource: $replan_second_resource" >&2; exit 1 ;; esac
          replan_build_action="$(printf '%s\n' "$replan_first_resource" | sed -E 's/^\[[^]]+\] //')"
          replan_website_action="$(printf '%s\n' "$replan_second_resource" | sed -E 's/^\[[^]]+\] //')"
          replan_lockfile_sha256="$(shasum -a 256 bun.lock | cut -d ' ' -f1)"
          replan_config_sha256="$(for file in alchemy.run.ts apps/docs/package.json apps/docs/vite.config.ts apps/docs/src/lib/build/cloudflare-stack.ts apps/docs/src/lib/build/docs-deployment-stage.ts apps/docs/public/_headers; do shasum -a 256 "$file"; done | shasum -a 256 | cut -d ' ' -f1)"
          replan_deployment_input_sha256="$(find apps/docs/dist -type f -print | LC_ALL=C sort | while IFS= read -r file; do shasum -a 256 "$file"; done | shasum -a 256 | cut -d ' ' -f1)"
          jq -nS \
            --arg commit "$CANDIDATE_SHA" \
            --arg lockfile "$replan_lockfile_sha256" \
            --arg deployment "$replan_deployment_input_sha256" \
            --arg config "$replan_config_sha256" \
            --arg build_action "$replan_build_action" \
            --arg website_action "$replan_website_action" \
            '{candidate:{deploymentInputSha256:$deployment,exactCommit:$commit,lockfileSha256:$lockfile},configSha256:$config,logicalResources:[{action:$build_action,logicalId:"DocsBuild",resourceType:"Command.Build"},{action:$website_action,logicalId:"DocsWebsite",resourceType:"Cloudflare.Worker"}],redaction:{ansiRemoved:true,secretValuesIncluded:false,timestampsExcludedFromDigest:true},schemaVersion:1,stack:"TaxKitDocsCloudflare",stage:"prod"}' \
            > "$RUNNER_TEMP/docs-deployment/replan-projection.json"
          replan_sha256="$(jq -cS . "$RUNNER_TEMP/docs-deployment/replan-projection.json" | tr -d '\n' | shasum -a 256 | cut -d ' ' -f1)"
          test "$ACCEPTED_PLAN_SHA256" = "$replan_sha256"
          jq --arg replan "$replan_sha256" '.replanSha256=$replan' "$RUNNER_TEMP/docs-deployment/plan.json" > "$RUNNER_TEMP/docs-deployment/plan.with-replan.json"
          mv "$RUNNER_TEMP/docs-deployment/plan.with-replan.json" "$RUNNER_TEMP/docs-deployment/plan.json"
          ALCHEMY_PLAIN=1 CI=1 bunx alchemy deploy --stage prod --profile "$ALCHEMY_PROFILE" --yes
          ALCHEMY_PROFILE="$ALCHEMY_PROFILE" CI=1 bun run check:docs-deployment-inventory > "$RUNNER_TEMP/docs-deployment/provider-inventory.json"
          jq -e '
            .agreement == "state-provider-agree" and
            ([.stages[] | select(.stage == "prod")] | length == 1) and
            ([.stages[] | select(.stage == "prod") | .resources | map(.logicalId) | sort] == [["DocsBuild", "DocsWebsite"]]) and
            ([.providerWorkers[] | select(.stage == "prod" and .logicalId == "DocsWebsite")] | length == 1)
          ' "$RUNNER_TEMP/docs-deployment/provider-inventory.json" > /dev/null
          worker_name="$(jq -er '.stages[] | select(.stage == "prod") | .resources[] | select(.logicalId == "DocsWebsite") | .workerName' "$RUNNER_TEMP/docs-deployment/provider-inventory.json")"
          worker_url="$(jq -er '.stages[] | select(.stage == "prod") | .resources[] | select(.logicalId == "DocsWebsite") | .workerUrl' "$RUNNER_TEMP/docs-deployment/provider-inventory.json")"
          deployments="$(bunx wrangler deployments list --name "$worker_name" --json)"
          deployment_id="$(jq -er '.[-1].id // .[-1].deployment_id' <<<"$deployments")"
          version_id="$(jq -er '.[-1].versions[0].version_id' <<<"$deployments")"
          jq -nS --arg workerName "$worker_name" --arg url "$worker_url" --arg deploymentId "$deployment_id" --arg versionId "$version_id" --arg candidate "$CANDIDATE_SHA" --arg plan "$ACCEPTED_PLAN_SHA256" --arg config "$replan_config_sha256" --arg deployment "$replan_deployment_input_sha256" --arg lockfile "$replan_lockfile_sha256" '{schemaVersion:1,stage:"prod",workerName:$workerName,url:$url,deploymentId:$deploymentId,versionId:$versionId,candidateCommit:$candidate,acceptedPlanSha256:$plan,configSha256:$config,deploymentInputSha256:$deployment,lockfileSha256:$lockfile}' > "$RUNNER_TEMP/docs-deployment/provider-readback.json"
          printf 'TAXKIT_DOCS_HOSTED_URL=%s\n' "$worker_url" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_DEPLOYMENT_ID=%s\n' "$deployment_id" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_VERSION_ID=%s\n' "$version_id" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_WORKER_NAME=%s\n' "$worker_name" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_STAGE=prod\n' >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_PLAN_SHA256=%s\n' "$ACCEPTED_PLAN_SHA256" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_CONFIG_SHA256=%s\n' "$replan_config_sha256" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_DEPLOYMENT_INPUT_SHA256=%s\n' "$replan_deployment_input_sha256" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_LOCKFILE_SHA256=%s\n' "$replan_lockfile_sha256" >> "$GITHUB_ENV"
          printf 'TAXKIT_DOCS_ROLLBACK_RECOVERY_IDENTITY=production-%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          if [ "$OPERATION" = "rollback" ]; then
            printf 'TAXKIT_DOCS_ENVIRONMENT=rollback\n' >> "$GITHUB_ENV"
          else
            printf 'TAXKIT_DOCS_ENVIRONMENT=production\n' >> "$GITHUB_ENV"
          fi
          printf 'TAXKIT_DOCS_EVIDENCE_DIRECTORY=docs/evidence/deployments/workflow-%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - name: Run hosted Production HTTP/browser/screenshot proof
        if: inputs.operation == 'deploy' || inputs.operation == 'rollback'
        run: |
          set -euo pipefail
          mkdir -p "$TAXKIT_DOCS_EVIDENCE_DIRECTORY"
          bun run --filter=docs test:cloudflare-hosted > "$RUNNER_TEMP/docs-deployment/hosted-proof.json"
          TAXKIT_WORKFLOW_PROVIDER_READBACK="$RUNNER_TEMP/docs-deployment/provider-readback.json" \
          TAXKIT_WORKFLOW_HOSTED_PROBE="$RUNNER_TEMP/docs-deployment/hosted-proof.json" \
          TAXKIT_WORKFLOW_CANDIDATE_COMMIT="$CANDIDATE_SHA" \
          TAXKIT_WORKFLOW_STAGE="$TAXKIT_DOCS_STAGE" \
          TAXKIT_WORKFLOW_PLAN_SHA256="$TAXKIT_DOCS_PLAN_SHA256" \
            bun run check:docs-deployment-workflow-proof

      - name: Upload sanitized Production plan and replan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: taxkit-docs-production-${{ github.run_id }}
          path: ${{ runner.temp }}/docs-deployment
          retention-days: 30
          if-no-files-found: error

      - name: Upload Production provider readback
        if: (inputs.operation == 'deploy' || inputs.operation == 'rollback') && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: taxkit-docs-production-provider-${{ github.run_id }}
          path: ${{ runner.temp }}/docs-deployment/provider-inventory.json
          retention-days: 30
          if-no-files-found: error
