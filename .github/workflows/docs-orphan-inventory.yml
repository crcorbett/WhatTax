name: Docs Orphan Inventory (Report Only)

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxkit-docs-orphan-inventory
  cancel-in-progress: true

jobs:
  inventory:
    name: Report exact TaxKit stage candidates
    if: github.repository == 'crcorbett/taxkit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: github-actions-report-only
    permissions:
      contents: read
    env:
      ALCHEMY_PROFILE: default
      ALCHEMY_STATE_STORE_CREDENTIALS_JSON: ${{ secrets.ALCHEMY_STATE_STORE_CREDENTIALS_JSON }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out reviewed default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Materialize the reviewed state-read cache
        run: |
          set -euo pipefail
          umask 077
          alchemy_home="$(bun -e 'import os from "node:os"; process.stdout.write(os.homedir())')"
          state_dir="$alchemy_home/.alchemy/credentials/$ALCHEMY_PROFILE"
          mkdir -p "$state_dir"
          printf '%s' "$ALCHEMY_STATE_STORE_CREDENTIALS_JSON" > "$state_dir/cloudflare-state-store.json"
          printf 'HOME=%s\n' "$alchemy_home" >> "$GITHUB_ENV"
          printf 'alchemy-home=%s\n' "$alchemy_home"
          bun -e 'import os from "node:os"; import { existsSync } from "node:fs"; const path = `${os.homedir()}/.alchemy/credentials/${process.env.ALCHEMY_PROFILE}/cloudflare-state-store.json`; console.log(JSON.stringify({ bunHome: os.homedir(), cacheExists: existsSync(path) }));'
          jq -e '(.accountId | type == "string" and length > 0) and (.url | type == "string" and startswith("https://")) and (.authToken | type == "string" and length > 0)' \
            "$state_dir/cloudflare-state-store.json" > /dev/null
          jq -r '{keys:(keys | sort | join(",")), accountIdLength:(.accountId | length), urlHost:(.url | capture("https://(?<host>[^/]+)").host), authTokenLength:(.authToken | length)}' \
            "$state_dir/cloudflare-state-store.json"

      - name: Run report-only orphan inventory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docs-deployment"
          bun run check:docs-deployment-orphans > "$RUNNER_TEMP/docs-deployment/orphan-report.json"

      - name: Upload report-only receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: taxkit-docs-orphan-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/docs-deployment/orphan-report.json
          retention-days: 30
          if-no-files-found: error
